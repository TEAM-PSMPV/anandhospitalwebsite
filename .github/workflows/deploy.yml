name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.anandhospitalmbd.org/
    env:
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare webmaster verification assets
        run: node scripts/prepare-indexnow-key.mjs
      - name: Verify production candidate
        run: |
          npm run lint
          npm test
      - name: Configure AppointFlow server secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPOINTFLOW_URL: ${{ secrets.APPOINTFLOW_URL }}
          APPOINTFLOW_API_KEY: ${{ secrets.APPOINTFLOW_API_KEY }}
        run: |
          node --input-type=module -e '
            import { spawnSync } from "node:child_process";
            const { APPOINTFLOW_URL, APPOINTFLOW_API_KEY } = process.env;
            if (!APPOINTFLOW_URL || !APPOINTFLOW_API_KEY) throw new Error("AppointFlow production secrets are required.");
            if (new URL(APPOINTFLOW_URL).protocol !== "https:") throw new Error("AppointFlow requires HTTPS.");
            const result = spawnSync("node_modules/.bin/wrangler", ["secret", "bulk"], {
              input: JSON.stringify({ APPOINTFLOW_URL, APPOINTFLOW_API_KEY }),
              stdio: ["pipe", "inherit", "inherit"],
            });
            if (result.error) throw result.error;
            process.exit(result.status ?? 1);
          '
      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 10 https://www.anandhospitalmbd.org/ > /dev/null
          curl --fail --show-error --silent https://www.anandhospitalmbd.org/sitemap.xml > /dev/null
          curl --fail --show-error --silent https://www.anandhospitalmbd.org/robots.txt | grep -F "Sitemap: https://www.anandhospitalmbd.org/sitemap.xml"
      - name: Notify Bing and participating search engines through IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
