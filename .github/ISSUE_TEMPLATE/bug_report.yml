name: Bug report
description: Report a reproducible website problem without sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not submit patient data, credentials, or security vulnerabilities. See SECURITY.md for private reporting.
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://www.anandhospitalmbd.org/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and exact reproduction steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows 11
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included patient data, credentials, or vulnerability details.
          required: true
